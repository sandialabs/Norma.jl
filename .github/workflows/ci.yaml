name: Norma CI

on:
  push:
    branches:
      - main
    tags: ['*']
    # Documentation-only pushes do not affect the tests; skip the suite for them
    # (the Documentation workflow handles docs). Any change under src/, test/,
    # ext/, or the project files still runs the full matrix.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/documentation.yaml'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11', '1.12']
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'  # Specify your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch
          pip install numpy
          pip install git+https://github.com/sandialabs/norma-opinf.git@nnopinf_updates

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Build project
        uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: python

      # PyCall is now an optional weak dependency, so julia-buildpkg above does
      # not install or build it. The neural-network OpInf ROM test needs PyCall
      # pointed at the system Python (where torch is pip-installed). Build it
      # explicitly here so its shared deps.jl is configured against `python`
      # rather than falling back to the Conda backend (which isn't provisioned).
      # This also overrides any Conda-configured deps.jl restored from cache.
      - name: Build PyCall against the system Python
        run: julia --color=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.add("PyCall"); Pkg.build("PyCall")'
        env:
          PYTHON: python

      - name: Run tests
        run: julia --color=no --project=. -e 'using Pkg; Pkg.test(; coverage=true, test_args=["--with-nnopinf"])'
        env:
          PYTHON: python

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
