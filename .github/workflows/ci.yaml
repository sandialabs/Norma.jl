name: Norma CI

on:
  push:
    branches:
      - main
    tags: ['*']
    # Documentation-only pushes do not affect the tests; skip the suite for them
    # (the Documentation workflow handles docs). Any change under src/, test/,
    # ext/, or the project files still runs the full matrix.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/documentation.yaml'
  pull_request:
  # The full suite, daily at 07:00 UTC: midnight in Pacific Daylight Time,
  # 23:00 of the previous day in Pacific Standard Time. Cron has no time zone.
  schedule:
    - cron: '0 7 * * *'
  # Manual dispatch also runs the full suite.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  # Formatting with the JuliaFormatter version pinned in format/Manifest.toml
  # and the style in .JuliaFormatter.toml. The pinned version keeps the check
  # from changing its result when a new formatter release changes its output.
  format:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Check formatting
        run: |
          julia --color=no --project=format -e 'using Pkg; Pkg.instantiate()'
          julia --color=no --project=format format/format.jl --check

  # The test matrix: every platform and Julia version, without coverage
  # instrumentation, which is collected by the separate job below.
  #
  # Pushes and pull requests run the quick set, which leaves out the long
  # AHeaD, swap, and restart cases and the neural-network OpInf test. Measured
  # on October 19, 2026, the full suite took 44 min on Julia 1.13 ubuntu and
  # 92 min on Julia 1.12 ubuntu, of which the AHeaD tests were 26 and 63 min;
  # the quick set takes about a quarter of that. The scheduled daily run and
  # manual dispatch run the full suite with the neural-network OpInf test,
  # which is the only test that needs Python with torch and norma-opinf.
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12', '1.13']
        os: [ubuntu-latest, macos-latest]
    env:
      FULL_SUITE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}

      - name: Set up Python
        if: env.FULL_SUITE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # The CPU wheel of torch: the default wheel pulls the CUDA libraries,
      # several gigabytes that the runner cannot use, and took 106 s to
      # install against about 15 s for the CPU wheel.
      - name: Install Python dependencies
        if: env.FULL_SUITE == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          pip install git+https://github.com/sandialabs/norma-opinf.git@nnopinf_updates

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Build project
        uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: python3

      # PyCall is an optional weak dependency, so julia-buildpkg above does
      # not install or build it, but it is a test dependency, so Pkg.test
      # builds it whenever the cached depot lacks a build of the resolved
      # version. The neural-network OpInf ROM test needs PyCall pointed at the
      # system Python (where torch is pip-installed). Build it explicitly here
      # so its shared deps.jl is configured against `python3` rather than
      # falling back to the Conda backend (which isn't provisioned). This also
      # overrides any Conda-configured deps.jl restored from cache. Conda's
      # module body requires its root environment directory, which only
      # Conda's build script creates and which the cache does not keep, so
      # Conda is built first, before the PyCall build loads it, with automatic
      # precompilation disabled until then. The test step precompiles
      # everything afterwards. With the Python set up above, `python3` is that
      # Python; otherwise it is the runner's.
      - name: Build PyCall against the system Python
        run: julia --color=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.add("Conda"); Pkg.build("Conda"); Pkg.add("PyCall"); Pkg.build("PyCall")'
        env:
          PYTHON: python3
          JULIA_PKG_PRECOMPILE_AUTO: 0

      - name: Run tests
        run: |
          julia --color=no --project=. -e 'using Pkg; Pkg.test(; test_args=[ENV["FULL_SUITE"] == "true" ? "--with-nnopinf" : "--quick"])'
        env:
          PYTHON: python3

  # Coverage of the full suite on one platform, only on the scheduled daily
  # run and on manual dispatch. Instrumentation cost a factor of 1.26 on the
  # quick set on October 19, 2026 (1278 s against 1017 s of test time on Julia
  # 1.13 ubuntu), so the instrumented full suite takes about 52 min there.
  coverage:
    name: Coverage - Julia 1.13 - ubuntu-latest
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          pip install git+https://github.com/sandialabs/norma-opinf.git@nnopinf_updates

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v2

      - name: Build project
        uses: julia-actions/julia-buildpkg@v1
        env:
          PYTHON: python3

      # As in the test jobs: Conda's module body requires its root environment
      # directory, which the cache does not keep and only Conda's build script
      # creates, so a PyCall build inside Pkg.test fails on the precompilation
      # of Conda. Build Conda and then PyCall here, with automatic
      # precompilation disabled, against the Python set up above.
      - name: Build PyCall against the system Python
        run: julia --color=no -e 'using Pkg; Pkg.activate(; temp=true); Pkg.add("Conda"); Pkg.build("Conda"); Pkg.add("PyCall"); Pkg.build("PyCall")'
        env:
          PYTHON: python3
          JULIA_PKG_PRECOMPILE_AUTO: 0

      - name: Run the full suite with coverage
        run: julia --color=no --project=. -e 'using Pkg; Pkg.test(; coverage=true, test_args=["--with-nnopinf"])'
        env:
          PYTHON: python3

      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
