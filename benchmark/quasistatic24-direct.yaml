type: single
input mesh file: cube24.g
output mesh file: quasistatic24-direct.e
Exodus output interval: 1.0
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      cube: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.3
      density: 1000.0
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 1.0
  time step: 0.1
boundary conditions:
  Dirichlet:
    - node set: nsz-
      component: x
      function: "0.0"
    - node set: nsz-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsz+
      component: z
      function: "0.02 * t"
solver:
  type: Hessian minimizer
  step: full Newton
  linear solver: direct
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
