type: single
input mesh file: cube24.g
output mesh file: implicit24-cg-jacobi.e
Exodus output interval: 1.0e-4
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      cube: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.3
      density: 1000.0
time integrator:
  type: Newmark
  initial time: 0.0
  final time: 1.0e-4
  time step: 1.0e-5
  β: 0.25
  γ: 0.5
initial conditions:
  displacement:
    - node set: nsall
      component: z
      function: "a=0.001; s=0.02; a*exp(-z*z/s/s/2)"
boundary conditions:
  Dirichlet:
    - node set: nsz-
      component: x
      function: "0.0"
    - node set: nsz-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
solver:
  type: Hessian minimizer
  step: full Newton
  linear solver: cg
  preconditioner: jacobi
  minimum iterations: 1
  maximum iterations: 8
  relative tolerance: 1.0e-8
  absolute tolerance: 1.0e-06
