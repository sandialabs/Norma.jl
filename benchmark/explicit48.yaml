type: single
input mesh file: cube48.g
output mesh file: explicit48.e
Exodus output interval: 1.0e-4
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      cube: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.3
      density: 1000.0
time integrator:
  type: central difference
  initial time: 0.0
  final time: 1.0e-4
  time step: 1.0e-6
  CFL: 0.9
  γ: 0.5
initial conditions:
  displacement:
    - node set: nsall
      component: z
      function: "a=0.001; s=0.02; a*exp(-z*z/s/s/2)"
boundary conditions:
  Dirichlet:
    - node set: nsz-
      component: x
      function: "0.0"
    - node set: nsz-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
solver:
    type: explicit solver
    step: explicit
