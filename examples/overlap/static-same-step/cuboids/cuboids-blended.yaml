type: multi
domains: ["cuboid-1.yaml", "cuboid-2.yaml"]
CSV output interval: 0
initial time: 0.0
final time: 1.0
time step: 1.0
minimum iterations: 1
maximum iterations: 16
relative tolerance: 1.0e-12
absolute tolerance: 1.0e-08
# Emit overlap-corrected (Arlequin-blended) energy to cuboids-blended-energy.csv:
# columns time, stored_energy, kinetic_energy, total_energy, one row per stop.
# The blending removes the double count of the shared overlap region.
blended energy output: true
