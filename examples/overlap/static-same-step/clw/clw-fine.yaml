type: single
input mesh file: clw-fine.g
output mesh file: clw-fine.e
model:
  type: solid mechanics
  material:
    blocks:
      base_material: steel
    steel:
      model: j2 plasticity
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.25
      density: 7800.0
      yield stress: 1.0e+09
      hardening modulus: 20.0e+09
time integrator:
  type: quasi static
boundary conditions:
  Dirichlet:
    - node set: x_symmetry_surface
      component: x
      function: "0.0"
    - node set: y_symmetry_surface
      component: y
      function: "0.0"
  Schwarz overlap:
    - side set: schwarz_fine_ss
      source: clw-coarse
      source block: base_material
solver:
  type: Hessian minimizer
  step: full Newton
  use line search: true
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-08
  absolute tolerance: 1.0e-12
