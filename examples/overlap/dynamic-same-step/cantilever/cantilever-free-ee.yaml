type: single
input mesh file: cantilever-free.g
output mesh file: cantilever-free.e
model:
  type: solid mechanics
  material:
    blocks:
      cantilever_free: hyperelastic
    hyperelastic:
      model: linear elastic
      elastic modulus: 6.895e+09
      Poisson's ratio: 0.25
      density: 2768.0
time integrator:
  type: central difference
  initial time: 0.0
  time step: 1.0e-6
  CFL: 0.5
  γ: 0.5
initial conditions:
  displacement:
    - node set: nsall
      component: y
      function: "0.393701 * x * x"
boundary conditions:
  Schwarz overlap:
    - side set: ssx-
      source: cantilever-clamped-ee
      source block: cantilever_clamped
solver:
    type: explicit solver
    step: explicit
