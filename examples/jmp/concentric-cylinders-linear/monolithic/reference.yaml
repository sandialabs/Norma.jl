# Linear elastic version of the nested cylinders of
# examples/jmp/concentric-cylinders, for devising and testing conservation
# schemes: three nested cylinders (core, filler, shell) of linear elastic
# materials, fixed in z at the bottom face of the shell and moving at -5 m/s
# in z. With linear elastic materials the energy E2 of the differentiated
# system, which the constrained Dirichlet-Neumann exchange conserves, is
# defined, so the energy output measures conservation and not only
# boundedness. The speed is 5 m/s rather than the -35 m/s of the neohookean
# example, which strains the filler beyond the range of a small-strain model.
# The meshes are those of the neohookean example, referenced by relative path;
# run from this directory.
#
# Materials, with the moduli of the neohookean example:
#   core:   E = 100 GPa, Poisson ratio 0.33, density 4915 kg/m^3
#   shell:  E = 200 GPa, Poisson ratio 0.28963, density 7822.8 kg/m^3
#   filler: from K = 5.99 GPa and G = 71.658 MPa,
#           E = 9KG/(3K + G) = 2.1412016456580654e+08 Pa,
#           Poisson ratio (3K - 2G)/(2(3K + G)) = 0.4940422881311684,
#           density 1843 kg/m^3
#
# One-domain multidomain wrapper of cylinders.yaml, which writes the blended
# energy output (E1, and E2 of the differentiated system) to
# reference-energy.csv.
type: multi
domains: ["cylinders.yaml"]
blended energy output: true
Exodus output interval: 2.0e-05
CSV output interval: 0
initial time: 0.0
final time: 1.0e-03
time step: 5.0e-07
minimum iterations: 1
maximum iterations: 1
relative tolerance: 1.0e-12
absolute tolerance: 1.0e-15
