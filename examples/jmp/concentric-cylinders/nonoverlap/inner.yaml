type: single
input mesh file: inner.g
output mesh file: inner.e
model:
  type: solid mechanics
  material:
    blocks:
      core: core
      filler: filler
    core:
      model: neohookean
      elastic modulus: 100.0e+09
      Poisson's ratio: 0.33
      density: 4915.0
    filler:
      model: neohookean
      bulk modulus: 5.99e+09
      shear modulus: 7.1658e+07
      density: 1843.0
time integrator:
  type: central difference
  CFL: 0.5
  γ: 0.5
initial conditions:
  velocity:
    - node set: nsall
      component: z
      function: "-35.0"
boundary conditions:
  Schwarz DN nonoverlap:
    - side set: ssint
      source: outer
      source side set: ssint
      default BC type: Dirichlet
solver:
  type: explicit solver
  step: explicit
