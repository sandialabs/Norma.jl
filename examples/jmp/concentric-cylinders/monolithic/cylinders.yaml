type: single
input mesh file: cylinders.g
output mesh file: cylinders.e
Exodus output interval: 2.0e-05
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      core: core
      filler: filler
      shell: shell
    core:
      model: neohookean
      elastic modulus: 100.0e+09
      Poisson's ratio: 0.33
      density: 4915.0
    filler:
      model: neohookean
      bulk modulus: 5.99e+09
      shear modulus: 7.1658e+07
      density: 1843.0
    shell:
      model: neohookean
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.28963
      density: 7822.8
time integrator:
  type: central difference
  initial time: 0.0
  final time: 1.0e-03
  time step: 5.0e-07
  CFL: 0.5
  γ: 0.5
initial conditions:
  velocity:
    - node set: nsall
      component: z
      function: "-35.0"
boundary conditions:
  Dirichlet:
    - node set: nsz-
      component: z
      function: "0.0"
solver:
  type: explicit solver
  step: explicit
