type: single
input mesh file: outer.g
output mesh file: outer.e
model:
  type: solid mechanics
  material:
    blocks:
      filler: filler
      shell: shell
    filler:
      model: neohookean
      bulk modulus: 5.99e+09
      shear modulus: 7.1658e+07
      density: 1843.0
    shell:
      model: neohookean
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.28963
      density: 7822.8
time integrator:
  type: central difference
  CFL: 0.5
  γ: 0.5
initial conditions:
  velocity:
    - node set: nsall
      component: z
      function: "-35.0"
boundary conditions:
  Dirichlet:
    - node set: nsz-
      component: z
      function: "0.0"
  Schwarz overlap:
    - side set: ssint
      source: inner
      source block: filler
solver:
  type: explicit solver
  step: explicit
