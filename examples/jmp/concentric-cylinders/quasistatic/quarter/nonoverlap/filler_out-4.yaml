type: single
input mesh file: filler_out.g
output mesh file: filler_out-4.e
model:
  type: solid mechanics
  material:
    blocks:
      filler: filler
    filler:
      model: neohookean
      bulk modulus: 5.99e+09
      shear modulus: 7.1658e+07
      density: 1843.0
time integrator:
  type: quasi static
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
  Schwarz RR nonoverlap:
    - side set: ssshell
      source: shell-4
      source block: shell
      source side set: ssshell
      robin parameter: 2.1e+13  # E_shell/h, h = 9.6 mm: near Dirichlet
    - side set: ssint
      source: filler_in-4
      source block: filler
      source side set: ssint
      robin parameter: 3.0e+10  # near the filler's interface stiffness
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
