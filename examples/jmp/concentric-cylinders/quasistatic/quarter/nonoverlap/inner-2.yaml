type: single
input mesh file: inner.g
output mesh file: inner-2.e
model:
  type: solid mechanics
  material:
    blocks:
      core: core
      filler: filler
    core:
      model: neohookean
      elastic modulus: 100.0e+09
      Poisson's ratio: 0.33
      density: 4915.0
    filler:
      model: neohookean
      bulk modulus: 5.99e+09
      shear modulus: 7.1658e+07
      density: 1843.0
time integrator:
  type: quasi static
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
  Schwarz DN nonoverlap:
    - side set: ssint
      source: outer-2
      source block: filler
      source side set: ssint
      default BC type: Dirichlet
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
