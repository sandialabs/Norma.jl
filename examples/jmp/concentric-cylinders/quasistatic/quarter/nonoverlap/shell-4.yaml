type: single
input mesh file: shell.g
output mesh file: shell-4.e
model:
  type: solid mechanics
  material:
    blocks:
      shell: shell
    shell:
      model: neohookean
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.28963
      density: 7822.8
time integrator:
  type: quasi static
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsz+
      component: z
      function: "-1.0e-03 * t"
  Schwarz RR nonoverlap:
    - side set: ssshell
      source: filler_out-4
      source block: filler
      source side set: ssshell
      robin parameter: 3.0e+10  # near the filler's interface stiffness
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
