type: single
input mesh file: outer.g
output mesh file: outer-2.e
model:
  type: solid mechanics
  material:
    blocks:
      filler: filler
      shell: shell
    filler:
      model: neohookean
      bulk modulus: 5.99e+09
      shear modulus: 7.1658e+07
      density: 1843.0
    shell:
      model: neohookean
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.28963
      density: 7822.8
time integrator:
  type: quasi static
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsz+
      component: z
      function: "-1.0e-03 * t"
  Schwarz DN nonoverlap:
    - side set: ssint
      source: inner-2
      source block: filler
      source side set: ssint
      default BC type: Neumann
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
