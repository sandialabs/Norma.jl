# Quasi-static reference for the Schwarz cases in ../nonoverlap: the quarter
# of the three nested cylinders, one conforming mesh with the element size of
# the inner Schwarz mesh throughout. The top face of the shell (nsz+) is
# displaced by -1 mm in z over t in [0, 1], in two steps; the bottom face
# (nsz-) is fixed in z; the symmetry planes x = 0 (nsx-) and y = 0 (nsy-) fix
# x and y. Without the symmetry planes the x and y translations and the
# rotation about z are free and the quasi-static problem is singular.
type: single
input mesh file: cylinders.g
output mesh file: cylinders.e
model:
  type: solid mechanics
  material:
    blocks:
      core: core
      filler: filler
      shell: shell
    core:
      model: neohookean
      elastic modulus: 100.0e+09
      Poisson's ratio: 0.33
      density: 4915.0
    filler:
      model: neohookean
      bulk modulus: 5.99e+09
      shear modulus: 7.1658e+07
      density: 1843.0
    shell:
      model: neohookean
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.28963
      density: 7822.8
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 1.0
  time step: 0.5
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsz+
      component: z
      function: "-1.0e-03 * t"
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
