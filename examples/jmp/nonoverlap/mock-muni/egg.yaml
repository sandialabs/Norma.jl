type: single
input mesh file: egg.g
output mesh file: egg.e
model:
  type: solid mechanics
  material:
    blocks:
      fuze_d2: menonium
      exp_d2: pbxih19
    menonium:
      model: neohookean
      elastic modulus: 100.0e+09
      Poisson's ratio: 0.33
      density: 4915.0
    pbxih19:
      model: neohookean
      bulk modulus: 5.99e9
      shear modulus: 7.1658e7
      density: 1843.0
time integrator:
  type: central difference
  CFL: 1.0
  γ: 0.5
initial conditions:
  velocity:
    - node set: nsall
      component: z
      function: "-35.0"
boundary conditions:
  Schwarz DN nonoverlap:
    - side set: ss_schwarz_egg
      source: case
      source side set: ss_schwarz_case
      default BC type: Dirichlet
solver:
    type: explicit solver
    step: explicit
