type: single
input mesh file: case.g
output mesh file: case.e
model:
  type: solid mechanics
  material:
    blocks:
      kase_d1: steel4320rc49
      exp_d1: pbxih19
    steel4320rc49:
      model: neohookean
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.28963
      density: 7822.8
    pbxih19:
      model: neohookean
      bulk modulus: 5.99e9
      shear modulus: 7.1658e7
      density: 1843.0
time integrator:
  type: central difference
  CFL: 1.0
  γ: 0.5
initial conditions:
  velocity:
    - node set: nsall
      component: z
      function: "-35.0"
boundary conditions:
  Dirichlet:
    - node set: ns_bottom_kase
      component: z
      function: "0.0"
    - node set: ns_bottom_exp_d1
      component: z
      function: "0.0"
  Schwarz DN nonoverlap:
    - side set: ss_exp_d1_schwarz
      source: egg
      source side set: ss_egg_schwarz
      default BC type: Neumann
solver:
    type: explicit solver
    step: explicit
