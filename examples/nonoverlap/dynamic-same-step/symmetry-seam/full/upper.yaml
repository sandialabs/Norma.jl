type: single
input mesh file: upper.g
output mesh file: upper.e
model:
  type: solid mechanics
  material:
    blocks:
      titanium: titanium
    titanium:
      model: linear elastic
      elastic modulus: 100.0e+09
      Poisson's ratio: 0.33
      density: 4915.0
time integrator:
  type: central difference
  time step: 1.0e-07
  CFL: 1.0
  γ: 0.5
initial conditions:
  velocity:
    - node set: nsall
      component: z
      function: "-35.0"
boundary conditions:
  Schwarz DN nonoverlap:
    - side set: ssint
      source: lower
      source side set: ssint
      default BC type: Dirichlet
      matching: velocity
solver:
  type: explicit solver
  step: explicit
