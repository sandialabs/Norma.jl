type: single
input mesh file: lower.g
output mesh file: lower.e
model:
  type: solid mechanics
  material:
    blocks:
      steel: steel
    steel:
      model: linear elastic
      elastic modulus: 200.0e+09
      Poisson's ratio: 0.3
      density: 7800.0
time integrator:
  type: central difference
  time step: 1.0e-07
  CFL: 1.0
  γ: 0.5
initial conditions:
  velocity:
    - node set: nsall
      component: z
      function: "-35.0"
boundary conditions:
  Dirichlet:
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
  Schwarz DN nonoverlap:
    - side set: ssint
      source: upper
      source side set: ssint
      default BC type: Neumann
      matching: velocity
solver:
  type: explicit solver
  step: explicit
