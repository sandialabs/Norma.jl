type: single
input mesh file: core.g
output mesh file: core-4.e
model:
  type: solid mechanics
  material:
    blocks:
      core: core
    core:
      model: neohookean
      elastic modulus: 100.0e+09
      Poisson's ratio: 0.33
      density: 4915.0
time integrator:
  type: quasi static
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
  Schwarz RR nonoverlap:
    - side set: sscore
      source: filler_in-4
      source block: filler
      source side set: sscore
      robin parameter: 1.0e+09  # near the filler's stiffness against the core's motion
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
