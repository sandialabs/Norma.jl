type: single
input mesh file: circle.g
output mesh file: circle.e
model:
  type: solid mechanics
  material:
    blocks:
      circle: inclusion
    inclusion:
      model: neohookean
      elastic modulus: 2.88e+09
      Poisson's ratio: 0.35
      density: 1000.0
time integrator:
  type: quasi static
boundary conditions:
  Schwarz DN nonoverlap:
    - side set: interface
      source: square
      source block: square
      source side set: hole
      default BC type: Dirichlet
      swap BC types: false
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
