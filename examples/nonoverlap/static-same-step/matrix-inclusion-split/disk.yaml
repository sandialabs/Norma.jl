type: single
input mesh file: disk.g
output mesh file: disk.e
model:
  type: solid mechanics
  material:
    blocks:
      disk: inclusion
    inclusion:
      model: neohookean
      elastic modulus: 2880000000.0
      Poisson's ratio: 0.35
      density: 1000.0
time integrator:
  type: quasi static
boundary conditions:
  Schwarz DN nonoverlap:
    - side set: arc_ll
      source: matrix
      source block: matrix
      source side set: arc_ll
      default BC type: Dirichlet
      swap BC types: false
    - side set: arc_lr
      source: matrix
      source block: matrix
      source side set: arc_lr
      default BC type: Dirichlet
      swap BC types: false
    - side set: arc_ul
      source: matrix
      source block: matrix
      source side set: arc_ul
      default BC type: Dirichlet
      swap BC types: false
    - side set: arc_ur
      source: matrix
      source block: matrix
      source side set: arc_ur
      default BC type: Dirichlet
      swap BC types: false
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
