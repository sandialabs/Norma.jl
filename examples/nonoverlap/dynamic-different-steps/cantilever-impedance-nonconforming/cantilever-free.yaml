type: single
input mesh file: cantilever-free.g
output mesh file: cantilever-free.e
model:
  type: solid mechanics
  material:
    blocks:
      cantilever_free: hyperelastic
    hyperelastic:
      model: linear elastic
      elastic modulus: 6.895e+09
      Poisson's ratio: 0.25
      density: 2768.0
time integrator:
  type: central difference
  time step: 2.5e-07
  CFL: 1.0
  γ: 0.5
initial conditions:
  displacement:
    - node set: nsall
      component: y
      function: "0.393701 * x * x"
boundary conditions:
  Schwarz impedance nonoverlap:
    - side set: ssx-
      source: cantilever-clamped
      source side set: ssx+
      robin parameter: 2.0e+09
      adjoint pairing: true
solver:
  type: explicit solver
  step: explicit
