type: single
input mesh file: clamped-bc.g
output mesh file: clamped-bc.e
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      clamped: elastic
    elastic:
      model: linear elastic
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.0
      density: 1000.0
time integrator:
  type: Newmark
  initial time: 0.0
  final time: 7.5e-04
  time step: 2.0e-06
  β: 0.25
  γ: 0.5
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsx+
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsy+
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "a=1.0e-3; tc=2.5e-4; tau=5.0e-5; a*exp(-(t-tc)*(t-tc)/tau/tau/2)"
    - node set: nsz+
      component: z
      function: "0.0"
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 4
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
