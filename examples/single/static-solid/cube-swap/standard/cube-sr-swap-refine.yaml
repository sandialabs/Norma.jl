type: single
input mesh file: cube.g
output mesh file: cube-sr-swap-refine.e
CSV output interval: 0
swaps:
  - replacement: cube-sr-swap-refine-phase2.yaml
    criterion:
      type: stress recovery
      direction: refine
      tolerance: 5.0e-2
model:
  type: solid mechanics
  material:
    blocks:
      cube: elastic
    elastic:
      model: linear elastic
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 1.0
  time step: 0.1
boundary conditions:
  Dirichlet:
    # Fully clamped base plus a bending tip load (z displacement linear in x)
    # produce an under-resolved stress field on this coarse mesh: the lumped
    # and consistent recovered stresses differ by ~37 %, well above tolerance.
    - node set: nsz-
      component: x
      function: "0.0"
    - node set: nsz-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsz+
      component: z
      function: "0.1 * x * t"
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-14
  absolute tolerance: 1.0e-08
  linear solver relative tolerance: 1.0e-14
  linear solver absolute tolerance: 1.0e-08
