type: single
input mesh file: cube.g
output mesh file: cube-sideset-dbc.e
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      cube: elastic
    elastic:
      model: linear elastic
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 1.0
  time step: 0.1
boundary conditions:
  # Dirichlet BCs applied on side sets instead of node sets.  These side sets
  # (ssx-, ssy-, ssz-, ssz+) cover the same faces as the node sets used in
  # cube.yaml, so the result is identical.  A Dirichlet entry uses a side set
  # when it provides a "side set" key and a node set when it provides a
  # "node set" key; everything else (component, function) is the same.
  Dirichlet:
    - side set: ssx-
      component: x
      function: "0.0"
    - side set: ssy-
      component: y
      function: "0.0"
    - side set: ssz-
      component: z
      function: "0.0"
    - side set: ssz+
      component: z
      function: "1.0 * t"
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-14
  absolute tolerance: 1.0e-08
  linear solver relative tolerance: 1.0e-14
  linear solver absolute tolerance: 1.0e-08
