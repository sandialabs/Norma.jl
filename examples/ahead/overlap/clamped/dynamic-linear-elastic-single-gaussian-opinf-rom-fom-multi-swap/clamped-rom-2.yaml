type: single
input mesh file: ../clamped-larger-2.g
output mesh file: clamped-2.e
CSV write sidesets: true
model:
  type: linear opinf rom
  model-file: linear-opinf-operator-2-M20.npz
  material:
    blocks:
      fine: hyperelastic
    hyperelastic:
      model: linear elastic
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.0
      density: 1000.0
time integrator:
  type: Newmark
  β: 0.25
  γ: 0.5
initial conditions:
  displacement:
    - node set: nsall
      component: z
      function: "a=0.001; s=0.02; a*exp(-z*z/s/s/2)"
  velocity:
    - node set: nsall
      component: z
      #WARNING: if you change elastic modiulus and density above, make sure to change them in the following line too!
      #Otherwise you will change the problem being solved.
      function: "a=0.001; s=0.02; E=1.0e+09; rho=1000.0; c=sqrt(E/rho); -a*c*z/s/s*exp(-z*z/s/s/2)"
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsx+
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsy+
      component: y
      function: "0.0"
    - node set: nsz+
      component: z
      function: "0.0"
  Schwarz overlap:
    - side set: ssz-
      source: clamped-fom-1
      source block: coarse
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
