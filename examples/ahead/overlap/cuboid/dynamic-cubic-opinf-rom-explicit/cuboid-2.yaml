type: single
input mesh file: ../cuboid-2.g
output mesh file: cuboid-2.e
model:
  type: cubic opinf rom
  model-file: cubic-opinf-operator.npz
  material:
    blocks:
      coarse: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: central difference
  CFL: 0.8
  γ: 0.5
boundary conditions:
  Dirichlet:
    - node set: nsz+
      component: z
      function: "0.5 - 0.5 * cos(pi * t)"
  Schwarz overlap:
    - side set: ssz-
      source: cuboid-1
      source block: fine
solver:
  type: explicit solver
  step: explicit
