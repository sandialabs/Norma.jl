type: single
input mesh file: ../notched-cylinder-coarse.g
output mesh file: notched-cylinder-coarse-j2-elastic-to-plastic-swap.e
CSV output interval: 0
swaps:
  - replacement: notched-cylinder-j2-elastic-to-plastic-swap-phase2.yaml
    criterion:
      type: elastic to plastic transition
      tolerance: 0.05   # 5 % of σy — default; shown here for clarity
model:
  type: solid mechanics
  nodal recovery:
    method: consistent
    von mises stress: true
    eqps: true
  material:
    blocks:
      fine: plastic
    plastic:
      model: j2 plasticity
      elastic modulus: 70.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
      yield stress: 250.0e+06
      hardening modulus: 0.7e+09
time integrator:
  type: quasi static
  initial time: 0.0
    #final time: 1.0
  final time: 0.3
  time step: 0.1
  decrease factor: 0.5
  increase factor: 1.2
  minimum time step: 1.0e-6
  maximum time step: 0.1
boundary conditions:
  Dirichlet:
    - node set: nodelist_1
      component: x
      function: "0.0"
    - node set: nodelist_2
      component: y
      function: "0.0"
    - node set: nodelist_3
      component: z
      function: "0.0"
    - node set: nodelist_4
      component: z
      function: "0.0064 * (0.5 - 0.5 * cos(pi * t))"
solver:
  type: Hessian minimizer
  step: full Newton
  use line search: true
  line search backtrack factor: 0.5
  line search decrease factor: 1.0e-04
  line search maximum iterations: 32
  minimum iterations: 1
  maximum iterations: 32
  relative tolerance: 1.0e-12
  absolute tolerance: 1.0e-08
