type: single
input mesh file: ../cuboid-1.g
output mesh file: cuboid-1.e
CSV output interval: 0
model:
  type: quadratic opinf rom
  model-file: qopinf-operator-1.npz
  nodal recovery:
    method: consistent
  material:
    blocks:
      fine: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: Newmark
  β: 0.25
  γ: 0.5
  decrease factor: 0.5
  increase factor: 1.2
  minimum time step: 1.0e-6
  maximum time step: 0.1
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
  Schwarz DN nonoverlap:
    - side set: ssz+
      source: cuboid-2
      source block: coarse
      source side set: ssz-
      default BC type: Dirichlet
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
  rom linear solver: iterative
