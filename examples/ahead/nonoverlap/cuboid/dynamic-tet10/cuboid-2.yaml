type: single
input mesh file: ../cuboid-tet10-2.g
output mesh file: cuboid-2.e
model:
  type: solid mechanics
  material:
    blocks:
      coarse: hyperelastic
    hyperelastic:
      model: neohookean
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: Newmark
  β: 0.25
  γ: 0.5
  maximum time step: 0.5
  minimum time step: 1.0e-07
  increase factor: 1.1
  decrease factor: 0.5
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz+
      component: z
      function: "0.25 - 0.25 * cos(pi * t)"
  Schwarz DN nonoverlap:
    - side set: ssz-
      source: cuboid-1
      source block: fine
      source side set: ssz+
        #robin parameter: 2.0e9
      default BC type: Neumann
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-06
