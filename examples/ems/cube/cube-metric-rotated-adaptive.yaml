# The target of cube-metric-adaptive.yaml turned by 45 degrees about z, so
# that the thin direction is the diagonal of the x-y plane rather than an
# axis.  Smoothing alone tells the two apart: the axis-aligned target is
# normal to a pair of fixed faces and leaves the mesh isotropic, while this
# one is partly reachable, since a path through the mesh can zigzag in the
# plane normal to the thin direction.  With the topological operations they
# agree, as they must, both ending at the target edge lengths
# (see docs/notes/ems-anisotropic).
type: single
input mesh file: cube.g
output mesh file: cube-metric-rotated-adaptive.e
adaptivity:
  size criterion: length
  shape criterion: scaled Jacobian
  boundary swaps: true
  size operations first: true
  desired energy density: 0.05
  minimum scaled Jacobian: 0.15
  adjacency layers: 2
  maximum passes: 10
  outer iterations: 12
model:
  type: mesh smoothing
  # Anisotropic target: the rotation vector is the axial vector of the
  # rotation whose columns are the principal directions, so a rotation of
  # 45 degrees about z puts the small size along the diagonal of the x-y
  # plane and the two larger sizes across it.  An edge is at its target when
  # it measures 0.025 along that diagonal or 0.2 across it, and the ideal
  # element is the unit regular tetrahedron scaled by the sizes and turned
  # with them.  Their product is the volume of an isotropic element of the
  # mesh size 0.1, so the target asks for a change of shape rather than
  # refinement.
  smooth reference: metric field unrestricted
  metric field:
    sizes: ["0.025", "0.2", "0.2"]
    rotation vector: ["0.0", "0.0", "0.7853981633974483"]
  material:
    blocks:
      cube: elastic
    elastic:
      model: seth-hill
      m: 2
      n: 2
      bulk modulus: 1.0e+03
      shear modulus: 1.0e+03
      density: 1000.0
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 1.0
  time step: 1.0e-01
boundary conditions:
  Surface:
    - side set: ssx-
      function: "x + 0.5"
    - side set: ssx+
      function: "x - 0.5"
    - side set: ssy-
      function: "y + 0.5"
    - side set: ssy+
      function: "y - 0.5"
    - side set: ssz-
      function: "z + 0.5"
    - side set: ssz+
      function: "z - 0.5"
solver:
  type: steepest descent
  step: lbfgs
  memory: 10
  minimum iterations: 1
  maximum iterations: 400
  relative tolerance: 1.0e-12
  absolute tolerance: 1.0e-08
  step length: 1.0e-3
  use line search: true
  line search backtrack factor: 0.5
  line search decrease factor: 1.0e-04
  line search maximum iterations: 16
  energy stagnation window: 5
  energy stagnation tolerance: 1.0e-03
