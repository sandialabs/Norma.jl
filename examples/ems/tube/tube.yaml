type: single
input mesh file: tube.g
output mesh file: tube.e
model:
  type: mesh smoothing
  smooth reference: max
  material:
    blocks:
      tube: elastic
    elastic:
      model: seth-hill
      m: 2
      n: 2
      bulk modulus: 1.0e+03
      shear modulus: 1.0e+03
      density: 1000.0
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 10.0
  time step: 1.0
boundary conditions:
  # Hollow tube (outer radius 1, inner radius 0.9, thickness/radius = 0.1),
  # exact local-frame roller.  Two curved lateral surfaces and two annular end
  # caps; a node on a cap and a lateral surface accumulates both level sets and
  # slides on the rim circle (the m = 2 edge case) automatically.
  Surface:
    - side set: outer            # outer lateral surface x^2 + y^2 = 1
      function: "x^2 + y^2 - 1.0"
    - side set: inner            # inner lateral surface x^2 + y^2 = 0.81
      function: "x^2 + y^2 - 0.81"
    - side set: bottom           # end cap at z = -1
      function: "z + 1.0"
    - side set: top              # end cap at z = +1
      function: "z - 1.0"
solver:
  type: steepest descent
  step: lbfgs
  memory: 10
  minimum iterations: 1
  maximum iterations: 64
  relative tolerance: 1.0e-12
  absolute tolerance: 1.0e-08
  step length: 1.0e-3
  use line search: true
  line search backtrack factor: 0.5
  line search decrease factor: 1.0e-04
  line search maximum iterations: 16
