# The TETRA10 cube of examples/element-types/tet10/cube with LCM's composite
# tet 10 (`composite tet 10`) at its default 4 integration points: 12 linear
# sub-tetrahedra per element, with projected gradients and exact masses.
# Pulled along z on rollers, the cube is in uniaxial stress.
type: single
input mesh file: cube.g
output mesh file: cube.e
CSV output interval: 0
model:
  type: solid mechanics
  composite tet 10: true
  material:
    blocks:
      cube: elastic
    elastic:
      model: linear elastic
      elastic modulus: 1.0e+09
      Poisson's ratio: 0.25
      density: 1000.0
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 1.0
  time step: 0.1
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsz+
      component: z
      function: "1.0 * t"
solver:
  type: Hessian minimizer
  step: full Newton
  minimum iterations: 1
  maximum iterations: 16
  relative tolerance: 1.0e-14
  absolute tolerance: 1.0e-10
