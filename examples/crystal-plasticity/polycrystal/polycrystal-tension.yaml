# A periodic Voronoi polycrystal of 25 FCC grains (polycrystal-voxels.xml,
# generated with MicroStructPy and converted with microstructpy_to_exodus.jl)
# with the crystal of LCM's RubiksCube, pulled along x to 0.5 % strain on
# rollers. Every grain has its own random lattice orientation, read from the
# element variables of the mesh. The tangent predictor spreads the increment
# of the loaded face over the polycrystal, and the steps are LCM's 5e-4,
# halved when they fail.
type: single
input mesh file: polycrystal-hex8.g
output mesh file: polycrystal-hex8.e
Exodus output interval: 1.0e-3
CSV output interval: 0
model:
  type: solid mechanics
  material:
    blocks:
      polycrystal: copper
    copper:
      model: crystal plasticity
      density: 1.0
      symmetry: cubic
      C11: 204600.0
      C12: 137700.0
      C44: 126200.0
      orientation:
        mesh variables: [phi1, Phi, phi2]
      integration scheme: implicit
      slip families:
        - slip systems: fcc
          flow rule:
            type: power law
            reference slip rate: 1.0
            rate exponent: 20.0
          hardening law:
            type: linear minus recovery
            hardening modulus: 355.0
            recovery modulus: 2.9
            initial hardening state: 122.0
time integrator:
  type: quasi static
  initial time: 0.0
  final time: 5.0e-3
  time step: 5.0e-4
  minimum time step: 1.0e-6
  maximum time step: 5.0e-4
  decrease factor: 0.5
  increase factor: 2.0
  predictor: tangent
boundary conditions:
  Dirichlet:
    - node set: nsx-
      component: x
      function: "0.0"
    - node set: nsy-
      component: y
      function: "0.0"
    - node set: nsz-
      component: z
      function: "0.0"
    - node set: nsx+
      component: x
      function: "1.0 * t"
solver:
  type: Hessian minimizer
  step: full Newton
  # The crystal plasticity tangent is not symmetric.
  linear solver: direct
  minimum iterations: 1
  maximum iterations: 20
  relative tolerance: 1.0e-10
  absolute tolerance: 1.0e-8
